server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative, so they survive a reverse proxy on another port.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # File names carry no version hash, so these always revalidate and a deploy shows up at once.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
    }
}
